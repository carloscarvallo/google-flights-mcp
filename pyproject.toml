[project]
name = "google-flights-mcp"
version = "0.2.0"
description = "MCP server that searches Google Flights and looks up airport codes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fast-flights>=3.1,<4",
    "mcp>=2.2,<3",
    "primp>=2,<3",
    "selectolax>=0.4,<1",
]

[project.scripts]
google-flights-mcp = "google_flights_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_flights_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=google_flights_mcp --cov-report=term-missing"
